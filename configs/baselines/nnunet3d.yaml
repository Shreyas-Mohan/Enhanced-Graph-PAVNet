model: "nnunet3d"
architecture: "MONAI DynUNet / nnU-Net (Isensee et al., Nature Methods 2021)"
in_channels: 1
out_channels: 3 # 0: Background, 1: Artery, 2: Vein
filters: [16, 32, 64, 128, 256]
strides: [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
dropout: 0.1
norm_name: "instance"
act_name: "leakyrelu"
patch_size: [64, 64, 64]
batch_size: 2
epochs: 50
lr: 0.0003
optimizer: "AdamW"
loss: "DiceCELoss"
device: "cuda:0"

