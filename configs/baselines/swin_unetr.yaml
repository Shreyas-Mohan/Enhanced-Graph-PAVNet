model: "swin_unetr"
architecture: "MONAI SwinUNETR (Tang et al., MICCAI BrainLes 2021)"
in_channels: 1
out_channels: 3 # 0: Background, 1: Artery, 2: Vein
img_size: [64, 64, 64]
feature_size: 48
use_checkpoint: true
batch_size: 2
epochs: 50
lr: 0.0001
optimizer: "AdamW"
loss: "DiceCELoss"
device: "cuda:0"

