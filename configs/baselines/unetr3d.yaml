model: "unetr3d"
architecture: "MONAI UNETR (Hatamizadeh et al., WACV 2022)"
in_channels: 1
out_channels: 3 # 0: Background, 1: Artery, 2: Vein
img_size: [64, 64, 64]
feature_size: 16
hidden_size: 768
mlp_dim: 3072
num_heads: 12
pos_embed: "conv"
norm_name: "instance"
dropout_rate: 0.0
batch_size: 2
epochs: 50
lr: 0.0001
optimizer: "AdamW"
loss: "DiceCELoss"
device: "cuda:0"

